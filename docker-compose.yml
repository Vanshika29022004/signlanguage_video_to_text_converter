version: '3.8'

services:
  sign-language-converter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sign_language_converter
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # Increase memory limit if needed for model inference
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
